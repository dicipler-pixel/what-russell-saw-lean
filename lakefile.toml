name = "what-russell-saw-lean"
version = "1.0.0"
defaultTargets = ["RussellRebuild", "RussellPhyslib", "RussellOrbits"]

# Physlib brings Mathlib v4.34.1 with it.
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "35d1bb4313be7127a39cd6cf29f02b758b9461b9"

[[lean_lib]]
name = "RussellRebuild"
srcDir = "lean"

[[lean_lib]]
name = "RussellPhyslib"
srcDir = "lean"

[[lean_lib]]
name = "RussellOrbits"
srcDir = "lean"
